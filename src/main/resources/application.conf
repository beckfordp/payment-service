port = 8080
port = ${?PAYMENT_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?PAYMENT_SERVICE_METRICS_PORT}

service-name = "payment-service"
service-name = ${?PAYMENT_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "payment"
  database = ${?POSTGRES_DB}
  user = "payment"
  user = ${?POSTGRES_USER}
  password = "payment"
  password = ${?POSTGRES_PASSWORD}
}

# Simulated PaymentGatewayClient (ADR 0011): outcome keyed by simulated card
# token (tok_<brand>_<last4>), "approve" or "decline:<reason>"; unlisted tokens
# use default-outcome. 4000 0000 0000 0002 tokenizes to tok_visa_0002.
payment-gateway.simulated {
  default-outcome = "approve"
  outcomes {
    "tok_visa_0002" = "decline:insufficient_funds"
  }
  authorization-ttl = 7d
}

# example-client is not read by the live service (payment-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
