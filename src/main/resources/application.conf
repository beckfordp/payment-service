port = 8080
port = ${?PAYMENT_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?PAYMENT_SERVICE_METRICS_PORT}

service-name = "payment-service"
service-name = ${?PAYMENT_SERVICE_NAME}

# Directory holding the build-time generated AsyncAPI HTML (sbt plugin output).
# Overridable for Docker/local layouts - never read via sys.env in code.
async-api-html-dir = "target/asyncapi-docs"
async-api-html-dir = ${?ASYNCAPI_HTML_DIR}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "payment"
  database = ${?POSTGRES_DB}
  user = "payment"
  user = ${?POSTGRES_USER}
  password = "payment"
  password = ${?POSTGRES_PASSWORD}
}

# Simulated PaymentGatewayClient (ADR 0011): outcome keyed by simulated card
# token (tok_<brand>_<last4>), "approve" or "decline:<reason>"; unlisted tokens
# use default-outcome. 4000 0000 0000 0002 tokenizes to tok_visa_0002.
# capture-outcomes is the capture-time equivalent (US-19.1): a token can
# authorize successfully yet decline when captured - 5555 5555 5555 4444
# tokenizes to tok_mastercard_4444 and is used by verify-capture.sh.
payment-gateway.simulated {
  default-outcome = "approve"
  outcomes {
    "tok_visa_0002" = "decline:insufficient_funds"
  }
  default-capture-outcome = "approve"
  capture-outcomes {
    "tok_mastercard_4444" = "decline:capture_declined"
  }
  authorization-ttl = 7d
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
  dlq-retry {
    max-retries = 3
    base-delay = 200ms
  }
  dlq-publish-resilience {
    retry {
      max-retries = 3
      base-delay = 100ms
    }
    circuit-breaker {
      failure-threshold = 5
      reset-timeout = 30s
    }
  }
  stream-supervisor {
    base-delay = 1s
    max-delay = 30s
  }
}

# example-client is not read by the live service (payment-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
