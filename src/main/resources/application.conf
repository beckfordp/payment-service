port = 8080
port = ${?PAYMENT_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?PAYMENT_SERVICE_METRICS_PORT}

service-name = "payment-service"
service-name = ${?PAYMENT_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "payment"
  database = ${?POSTGRES_DB}
  user = "payment"
  user = ${?POSTGRES_USER}
  password = "payment"
  password = ${?POSTGRES_PASSWORD}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
}

# example-client is not read by the live service (payment-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
