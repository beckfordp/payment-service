port = 8080
port = ${?PAYMENT_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?PAYMENT_SERVICE_METRICS_PORT}

service-name = "payment-service"
service-name = ${?PAYMENT_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "payment"
  database = ${?POSTGRES_DB}
  user = "payment"
  user = ${?POSTGRES_USER}
  password = "payment"
  password = ${?POSTGRES_PASSWORD}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}

  # Message-processing retry before a message is routed to <topic>-dlq -
  # deliberately much shorter/bounded than stream-supervisor below: this is
  # "retry processing this one message a few times," not "back off a whole
  # crashed stream."
  dlq-retry {
    max-retries = 3
    base-delay = 200ms
  }

  # Guards the DLQ's own publish call (purekafka's DeadLetter, ADR 0010).
  dlq-publish-resilience {
    retry {
      max-retries = 3
      base-delay = 100ms
    }
    circuit-breaker {
      failure-threshold = 5
      reset-timeout = 30s
    }
  }

  # Restart-with-backoff for a crashed consumer stream (TD-2.4, ADR 0010).
  stream-supervisor {
    base-delay = 1s
    max-delay = 30s
  }
}

# example-client is not read by the live service (payment-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
